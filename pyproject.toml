[project]
name = "pacopt"
version = "0.1.0"
description = "Profit-aware customer growth and campaign optimization engine (UCI Bank Marketing dataset)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
]
docs = [
    "markdown>=3.11.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
